<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nubila — jardín digital. Habitación interactiva (Terrario)."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Nubila — La Habitación</title>
    <script>
      try {
        var t = localStorage.getItem("nubila-garden-theme");
        document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
